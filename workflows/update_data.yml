name: Update TASE Portfolio Data

on:
  schedule:
    # Запуск с воскресенья по четверг (торговые дни TASE) в 16:30 UTC (~19:30 по Израилю)
    - cron: '30 16 * * 0-4'
  workflow_dispatch: # Позволяет запускать вручную по кнопке Run workflow в GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run updater script
        run: python updater.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update market data [skip ci]" && git push)
